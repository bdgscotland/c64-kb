# Mini-corpus fixture for M8.1 integration test.
#
# 50 tunes spanning:
#   - ≥30 PSID tunes (majority)
#   - ≥8 RSID tunes (Galway/Arkanoid, Tel/Turbo_Outrun, Huelsbeck/Giana, + others)
#   - ≥5 multi-SID tunes (2SID and 3SID)
#   - 5+ composers: Hubbard, Galway, Tel, Hülsbeck, Daglish, Gray, Ouwehand, Follin, JCH, DRAX
#   - 1 cover pair: Commando self-pair (canonical self-detection sanity check)
#
# Format notes:
#   expected_subtunes_min: lower bound on subtune count (some files have many)
#   expected_composer_substring: case-insensitive substring to match in composer field
#   expected_is_rsid: true if the SID header should read "RSID"
#   expected_sid_count_min: minimum sid_count field (2 or 3 for multi-SID)
#   cover_pair: marks both halves of the self-pair for memorization check

# Curated 2026-05-19 for Phase A / Task M8.1.
# Verified on-disk: ./data/hvsc-corpus/C64Music

