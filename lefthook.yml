# Git hooks. Each command is the npm script CI and the Claude Code hooks run.
# Install once per clone: npx lefthook install
pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,json}"
      run: npm run -s typecheck
    lint:
      glob: "*.ts"
      run: npx eslint --max-warnings=0 {staged_files}
    format:
      glob: "*.{ts,js,json,yml}"
      run: npx prettier --check {staged_files}
    listings:
      glob: "docs/**/*.md"
      run: for f in {staged_files}; do node scripts/check-listings.ts --allow-missing --file "$f" || exit 1; done
    unit:
      glob: "*.ts"
      run: npm run -s test:unit
    # The build sees declaration-emit errors typecheck cannot.
    build:
      glob: "*.{ts,json}"
      run: npm run -s build
# No pre-push: lefthook 2 skips pre-push commands when it cannot match the
# pushed files ("no matching push files", seen 2026-09-23). CI runs the full
# test suite on every push.
