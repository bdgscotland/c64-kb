# The same gates CLAUDE.md lists, run on every push and pull request. Each
# step calls an npm script, so the Claude Code hooks, the git hooks
# (lefthook.yml) and CI cannot drift apart.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its older run. On main every commit
# gets a full run: two sessions push there minutes apart, and cancelling
# left no finished run at all (five cancelled in a row, 2026-09-24).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck, lint, format, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test:unit
      - run: npm run build
      - name: package carries dist/
        run: npm pack --dry-run 2>&1 | grep -q "dist/cli.js"

  integration:
    name: integration tests (Qdrant, FalkorDB, Ollama)
    runs-on: ubuntu-24.04
    services:
      # Same digests as docker-compose.yml.
      qdrant:
        image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
        ports: ["7333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-retries 20
      falkordb:
        image: falkordb/falkordb@sha256:e93fcd753fe612fb0a222166a0620a1ae31b826a12f223c3b6d06038d9d7a364
        ports: ["7379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
      ollama:
        image: ollama/ollama:0.34.3@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b
        ports: ["11434:11434"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Pull, then embed once: loading the model into memory takes longer on a
      # CPU runner than a test's setup hook allows (10 s timed out, 2026-09-23).
      - name: pull and load the embedding model
        run: |
          curl -sf http://localhost:11434/api/pull -d '{"model":"mxbai-embed-large"}' | tail -1
          curl -sf http://localhost:11434/api/embed -d '{"model":"mxbai-embed-large","input":"warm"}' > /dev/null
      - run: npm run test:integration

  listings:
    name: every listing builds (KickAssembler, cc65)
    runs-on: ubuntu-24.04
    env:
      KICKASS_JAR: ${{ github.workspace }}/.tools/kickass/KickAss.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/kickass/KickAssembler.zip
          key: kickassembler-5.25-9ef752c12b25f64b
      # theweb.dk once served a file that failed the checksum (run
      # 35944152577) while the same URL was fine seconds later: retry.
      - name: KickAssembler 5.25
        run: |
          mkdir -p .tools/kickass && cd .tools/kickass
          sum=9ef752c12b25f64b55bafecfabf23dfc90a8216b1a293548b2147ed7c15f55a6
          for i in 1 2 3 4 5; do
            echo "$sum  KickAssembler.zip" | sha256sum -c --status - 2>/dev/null && break
            curl -sfL --retry 3 -o KickAssembler.zip https://theweb.dk/KickAssembler/KickAssembler.zip || true
            sleep $((i * 5))
          done
          echo "$sum  KickAssembler.zip" | sha256sum -c -
          unzip -q -o KickAssembler.zip KickAss.jar
      - run: sudo apt-get install -y -qq cc65
      # Oscar64 is skipped (--allow-missing) until issue #25 pins a released
      # compiler that reproduces the recipes; today only a locally patched
      # build does.
      - run: npm run check:listings -- --allow-missing

  recipes:
    name: every recipe runs in VICE and matches its screenshot
    runs-on: ubuntu-24.04
    env:
      KICKASS_JAR: ${{ github.workspace }}/.tools/kickass/KickAss.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: >-
          sudo apt-get install -y -qq cc65 build-essential xa65 dos2unix libpng-dev
          pkg-config flex bison libcurl4-openssl-dev python3-pil
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/kickass/KickAssembler.zip
          key: kickassembler-5.25-9ef752c12b25f64b
      # theweb.dk once served a file that failed the checksum (run
      # 35944152577) while the same URL was fine seconds later: retry.
      - name: KickAssembler 5.25
        run: |
          mkdir -p .tools/kickass && cd .tools/kickass
          sum=9ef752c12b25f64b55bafecfabf23dfc90a8216b1a293548b2147ed7c15f55a6
          for i in 1 2 3 4 5; do
            echo "$sum  KickAssembler.zip" | sha256sum -c --status - 2>/dev/null && break
            curl -sfL --retry 3 -o KickAssembler.zip https://theweb.dk/KickAssembler/KickAssembler.zip || true
            sleep $((i * 5))
          done
          echo "$sum  KickAssembler.zip" | sha256sum -c -
          unzip -q -o KickAssembler.zip KickAss.jar
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/vice-headless
          key: vice-headless-${{ runner.os }}-${{ hashFiles('scripts/build-vice-headless.sh') }}
      # A Linux build of this script matched every pinned PNG it could run
      # (54 of 54, 2026-09-23); Oscar64 recipes are skipped until #25.
      - run: "[ -x .tools/vice-headless/bin/x64sc ] || npm run vice:headless"
      # verify:recipes fails a recipe whose toolchain is absent, so the
      # Oscar64 pages are left out by directory until #25 pins a compiler.
      - name: verify KickAssembler and cc65 recipes
        run: |
          fail=0
          for f in docs/recipes/kickassembler/*.md docs/recipes/cc65/*.md; do
            # "|| rc=$?": under bash -e a non-zero verify would end the step
            # here with no name printed (run 35991987457 exited 1 silently).
            rc=0; out=$(node scripts/verify-recipes.ts --file "$f" --allow-missing 2>&1) || rc=$?
            if [ "$rc" -ne 0 ] || ! printf '%s\n' "$out" | tail -1 | grep -q " 0 failed"; then
              echo "FAILED: $f (exit $rc)"; printf '%s\n' "$out" | tail -15; fail=1
            fi
          done
          exit $fail

  package:
    name: the npm package works from an empty folder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: install the tarball into an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app && npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/c64-kb-*.tgz
          npx c64-kb version
      - name: start the stores with the package's own command
        working-directory: ${{ runner.temp }}/app
        run: npx c64-kb services up
      - name: Ollama with the embedding model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:0.34.3@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b
          for i in $(seq 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          curl -sf http://localhost:11434/api/pull -d '{"model":"mxbai-embed-large"}' | tail -1
      # Two pages keep the job short; the full corpus is the integration job's.
      - name: ingest, then look something up
        working-directory: ${{ runner.temp }}/app
        run: |
          mkdir docs-mini
          cp node_modules/c64-kb/docs/hardware/vic-ii-reference.md node_modules/c64-kb/docs/techniques/raster.md docs-mini/
          DOCS_DIR="$PWD/docs-mini" npx c64-kb ingest --clean
          npx c64-kb lookup-register D011 | grep -q "SCROLY"
          npx c64-kb search "stable raster interrupt" | grep -q "stable_raster_irq"
          test -f "$HOME/.local/share/c64-kb/bm25-vocab.json"
          test ! -e node_modules/c64-kb/data
